<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Media Extractor PRO — Page Grabber</title>
  <link rel="stylesheet" href="grabber.css">
  <script src="../lib/zip-builder.js"></script>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span> Media Extractor <span class="pro">PRO</span> — Page Grabber</div>
    <div class="head-actions">
      <span id="pageUrl" class="page-url"></span>
      <button id="clearList" class="btn btn-ghost text-danger">🧹 Clear</button>
      <button id="rescan" class="btn btn-ghost">⟳ Rescan</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-cat="all">🌟 All <span id="c-all" class="badge">0</span></button>
    <button class="tab" data-cat="video">🎬 Video <span id="c-video" class="badge">0</span></button>
    <button class="tab" data-cat="image">🖼 Images <span id="c-image" class="badge">0</span></button>
    <button class="tab" data-cat="audio">🎵 Audio <span id="c-audio" class="badge">0</span></button>
    <button class="tab" data-cat="doc">📄 Docs <span id="c-doc" class="badge">0</span></button>
  </nav>

  <div class="controls-bar">
    <div class="control-group search-group" style="flex: 1; max-width: 300px;">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search by name, resolution or format..." />
    </div>
    <div class="control-group">
      <label for="filterType">Filter:</label>
      <select id="filterType">
        <option value="all">All Formats</option>
      </select>
    </div>
    <div class="control-group">
      <label for="sortBy">Sort By:</label>
      <select id="sortBy">
        <option value="default">Default</option>
        <option value="name">Name</option>
        <option value="size">Size</option>
        <option value="type">Type/Extension</option>
      </select>
    </div>
    <div class="control-group">
      <label for="sortOrder">Order:</label>
      <select id="sortOrder">
        <option value="asc">Ascending</option>
        <option value="desc">Descending</option>
      </select>
    </div>
  </div>

  <div id="status" class="status">Scanning this page…</div>

  <main>
    <div class="bulk"><button id="dlAll" class="btn btn-primary">⬇ Download all in this view</button></div>
    <div id="grid" class="grid"></div>
  </main>

  <!-- Bulk Download Modal -->
  <div id="bulkModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 class="modal-title">📦 Bulk Download Options</h3>
      <p class="modal-desc">How would you like to download <span id="bulkCount">0</span> selected media files?</p>
      <div class="modal-options">
        <button id="dlZipBtn" class="btn-modal btn-primary">
          📦 Download as ZIP Archive
          <span class="btn-sub">Combines all files into 1 single .zip file (Recommended)</span>
        </button>
        <button id="dlIndivBtn" class="btn-modal btn-secondary">
          📁 Download as Individual Files
          <span class="btn-sub">Saves each file separately into Downloads folder</span>
        </button>
      </div>
      <button id="cancelModalBtn" class="mini-btn mt-2">Cancel</button>
    </div>
  </div>

  <!-- Video Preview Player Modal -->
  <div id="videoModal" class="modal-overlay hidden">
    <div class="video-modal-card">
      <div class="video-modal-header">
        <span id="videoTitle" class="video-modal-title">Media Preview</span>
        <button id="closeVideoBtn" class="mini-btn text-danger">✕ Close</button>
      </div>
      <div class="video-wrapper">
        <video id="previewPlayer" controls autoplay></video>
      </div>
    </div>
  </div>

  <footer><span id="serverState" class="muted">in-browser mode</span></footer>

  <script src="grabber.js"></script>
</body>
</html>
